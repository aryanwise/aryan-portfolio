<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F3EFE6">
    <meta name="description"
        content="Technical notes, research breakdowns, and autonomous systems logs by Aryan Mishra.">
    <script src="../theme.js"></script>
    <title>Aryan's Notebook</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23D97757'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='49' font-family='Georgia' fill='%23090A0A'%3Ea%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .writing-shell {
            max-width: 820px;
            margin: 0 auto;
            padding: 70px 0 90px;
        }

        .writing-header {
            margin-bottom: 48px;
        }

        .writing-header h1 {
            font-size: clamp(44px, 5.2vw, 68px);
            line-height: 1.08;
            letter-spacing: -.05em;
            margin-bottom: 18px;
        }

        .writing-intro {
            font-size: 17px;
            line-height: 1.75;
            color: #3d352e;
            max-width: 740px;
            margin: 0;
        }

        .posts-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-card {
            position: relative;
            background: #fffdf7;
            border: 1px solid #d9cfc0;
            border-radius: 12px;
            padding: 28px 30px;
            transition: transform 0.22s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.22s ease, border-color 0.22s ease;
            box-shadow: 0 4px 12px rgba(95, 71, 39, 0.04);
        }

        .post-card:hover {
            transform: translateY(-2px);
            border-color: #bfaea0;
            box-shadow: 0 10px 24px rgba(95, 71, 39, 0.08);
        }

        .post-meta-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .post-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--rust);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .post-tag::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--rust);
        }

        .post-date-read {
            font-size: 12px;
            color: #71665b;
            font-family: var(--sans);
        }

        .post-card h2 {
            font-size: 26px;
            letter-spacing: -0.035em;
            line-height: 1.25;
            margin: 0 0 10px;
            color: #1a1715;
            transition: color 0.2s ease;
        }

        .post-card:hover h2 {
            color: var(--rust);
        }

        .post-summary {
            font-size: 15px;
            line-height: 1.65;
            color: #4a4138;
            margin: 0 0 18px;
        }

        .post-action {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #1a1715;
            border-top: 1px solid #ebe4d8;
            padding-top: 14px;
        }

        .post-action span.arrow {
            color: var(--rust);
            font-size: 16px;
            transition: transform 0.2s ease;
        }

        .post-card:hover .post-action span.arrow {
            transform: translate(2px, -2px);
        }

        .post-overlay-link {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            z-index: 1;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 48px;
            font-size: 14px;
            font-weight: 550;
            color: #24201d;
            border-bottom: 1px solid #cfc1b0;
            padding-bottom: 3px;
            transition: border-color 0.2s, color 0.2s;
        }

        .back-home:hover {
            color: var(--rust);
            border-color: var(--rust);
        }

        .nav-back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 400;
            color: var(--ink);
            text-decoration: none;
            border-bottom: none;
            padding: 10px 0;
            transition: color 0.2s ease;
        }

        .nav-back-link:hover {
            color: var(--rust);
        }

        @media (max-width: 600px) {
            .writing-shell {
                padding: 40px 0 60px;
            }

            .post-card {
                padding: 22px 20px;
            }

            .post-card h2 {
                font-size: 22px;
            }
        }

        @media (max-width: 700px) {
            .site-header .wordmark>span:not(.wordmark-symbol) {
                display: none !important;
            }

            .site-header .wordmark>.wordmark-symbol {
                display: inline-block !important;
            }
        }
    </style>
    <link rel="stylesheet" href="../theme.css">
</head>

<body>
    <div class="page-shell">
        <header class="site-header blog-header">
            <a class="wordmark" href="../index.html" aria-label="Aryan Mishra home">
                <span class="wordmark-symbol">am<span>·</span></span>
                <span>Aryan Mishra</span>
            </a>
            <nav aria-label="Main navigation">
                <a class="nav-back-link" href="../index.html">← Back to portfolio</a>
                <button class="theme-toggle" type="button" data-theme-toggle
                    aria-label="Light mode is on; switch to dark mode" aria-pressed="false"><span
                        class="theme-toggle-icon" aria-hidden="true">☀</span><span class="theme-toggle-text">Light
                        mode</span></button>
            </nav>
        </header>

        <main class="writing-shell">
            <header class="writing-header">
                <p class="eyebrow"><span class="little-rule" aria-hidden="true"></span>NOTITIA PRIVATA</p>
                <h1>Dear <em>Diary...</em></h1>
                <p class="writing-intro">
                    Here’s what’s actually been on my mind lately. Mostly writing down what I’m figuring out as I go so
                    I don’t forget—and leaving the pages open for anyone walking a similar path.
                </p>
            </header>

            <section class="posts-feed" id="posts-feed" aria-label="Articles list">
            </section>
        </main>
    </div>
    <script>
        async function renderPostsFeed() {
            const feedContainer = document.getElementById('posts-feed');

            try {
                // Fetch the manifest from the root posts folder
                const response = await fetch('../posts/posts.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const posts = await response.json();

                if (!posts.length) {
                    feedContainer.innerHTML = '<p style="color: var(--muted, #71665b);">No dispatches published yet.</p>';
                    return;
                }

                feedContainer.innerHTML = posts.map(post => `
                    <article class="post-card">
                        <a class="post-overlay-link" href="./post.html?file=${encodeURIComponent(post.file)}"
                            aria-label="Read ${post.title}"></a>
                        <div class="post-meta-top">
                            <span class="post-tag">${post.tag}</span>
                            <span class="post-date-read">${post.date} · ${post.readTime}</span>
                        </div>
                        <h2>${post.title}</h2>
                        <p class="post-summary">${post.summary}</p>
                        <div class="post-action">
                            <span>Read dispatch</span>
                            <span class="arrow" aria-hidden="true">↗</span>
                        </div>
                    </article>
                `).join('');
            } catch (error) {
                feedContainer.innerHTML = '<p style="color: var(--muted, #71665b);">Failed to load posts feed.</p>';
                console.error('Error loading posts manifest:', error);
            }
        }

        renderPostsFeed();
    </script>
</body>

</html>
