<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D0E11">
  <meta name="description" content="Notes on machine learning, autonomy, and building things by Aryan Mishra.">
  <script src="../theme.js?v=3"></script>
  <title>Reading a log</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="../favicon.svg?v=1">
  <link rel="stylesheet" href="../styles.css?v=3.3">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="./logs.css?v=5">
  <link rel="stylesheet" href="./reader.css?v=4">
  <script defer src="./reader.js?v=5"></script>
</head>

<body class="logs-page logs-reader-page">
  <a class="skip-link" href="#content">Skip to article</a>
  <div class="page-shell">
    <header class="site-header logs-header">
      <a class="wordmark" href="../index.html" aria-label="Aryan Mishra home">
        <span class="wordmark-symbol">am<span>·</span></span><span>Aryan Mishra</span>
      </a>
      <nav aria-label="Main navigation">
        <a class="nav-back-link" href="./index.html">← Back to logs</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">☀</span><span class="theme-toggle-text">Light mode</span>
        </button>
      </nav>
    </header>

    <main class="reader-shell" id="reader-main">
      <div class="reader-layout" id="reader-layout">
        <aside class="reader-sidebar" id="reader-sidebar" aria-label="Reading navigation" hidden>
          <div class="reader-sidebar-inner">
            <details class="reader-disclosure reader-lessons" id="reader-lessons" open hidden>
              <summary>Lessons <span class="reader-count" id="reader-lesson-count"></span><span class="reader-summary-mark" aria-hidden="true">+</span></summary>
              <div class="reader-disclosure-body">
                <a class="reader-course-title" id="reader-course-title"></a>
                <ol class="reader-lesson-list" id="reader-lesson-list"></ol>
              </div>
            </details>
          </div>
        </aside>

        <div class="reader-document">
          <div class="reader-outline" id="reader-outline" hidden>
            <button class="reader-outline-trigger" id="reader-outline-trigger" type="button" aria-label="On this page" aria-expanded="false" aria-controls="reader-outline-panel">
              <span class="reader-outline-label">On this page</span>
              <span class="reader-outline-bars" id="reader-outline-bars" aria-hidden="true"></span>
              <span class="reader-outline-toggle-mark" aria-hidden="true">+</span>
            </button>
            <nav class="reader-outline-panel" id="reader-outline-panel" aria-label="On this page" hidden>
              <span class="reader-outline-panel-title">On this page</span>
              <ol class="reader-outline-list" id="reader-outline-list"></ol>
            </nav>
          </div>
          <div class="entry-context" id="entry-context" hidden>
            <span class="entry-kind" id="entry-kind"></span>
            <span class="entry-meta" id="entry-meta"></span>
          </div>
          <article class="entry-content" id="content" aria-label="Article" aria-busy="true" tabindex="-1"><p class="reader-loading" role="status">Opening the log…</p></article>
          <nav class="entry-series" id="entry-series" aria-label="Previous and next lessons" hidden>
            <div class="entry-series-links" id="entry-series-links"></div>
          </nav>
          <a class="reader-return" id="entry-back" href="./index.html">← Back to Logs</a>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
